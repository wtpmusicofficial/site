<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazil Lander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #009739;
      --yellow: #FEDD00;
      --blue: #002776;
      --dark: #0a0f0a;
      --light: #f5f7f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .flag-stripes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.08;
    }

    .flag-stripes::before,
    .flag-stripes::after {
      content: '';
      position: absolute;
      left: 0;
      width: 100%;
      height: 33.33%;
    }

    .flag-stripes::before {
      top: 0;
      background: var(--green);
    }

    .flag-stripes::after {
      bottom: 0;
      background: var(--blue);
    }

    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--green), var(--yellow), var(--blue));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 6s ease infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .tagline {
      font-size: 1.25rem;
      font-weight: 300;
      opacity: 0.9;
      max-width: 400px;
      margin-bottom: 3rem;
    }

    .cta {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, var(--green), #00b84a);
      color: white;
      text-decoration: none;
      font-weight: 500;
      border-radius: 50px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0, 151, 57, 0.4);
    }

    .embed-zone {
      margin-top: 4rem;
      padding: 2rem;
      width: 100%;
      max-width: 800px;
      min-height: 200px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }

    .embed-zone iframe {
      display: block;
      border-radius: 8px;
    }

    .embed-credit {
      margin-top: 0.5rem;
      font-size: 10px;
      color: #999;
      line-break: anywhere;
      word-break: normal;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .embed-credit a {
      color: #999;
      text-decoration: none;
    }

    .embed-credit a:hover {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="flag-stripes"></div>

  <main class="hero">
    <h1 class="logo">Brazil Lander</h1>
    <p class="tagline">Your gateway to Brazil</p>
    <a href="#" class="cta">Get Started</a>

    <div class="embed-zone" id="embed-target">
      <iframe id="soundcloud-player" width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2276464058&color=%23ff5500&auto_play=false&hide_related=true&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe>
      <div class="embed-credit"><a href="https://soundcloud.com/we-the-people-450864929" title="WE THE PEOPLE" target="_blank">WE THE PEOPLE</a> · <a href="https://soundcloud.com/we-the-people-450864929/declan-mckenna-brazil-we-the" title="Declan McKenna - Brazil (WE THE PEOPLE REMIX)" target="_blank">Declan McKenna - Brazil (WE THE PEOPLE REMIX)</a></div>
    </div>
  </main>

  <script src="https://w.soundcloud.com/player/api.js" async></script>
  <script>
    (function() {
      const STORAGE_KEY = 'bl_user_id';
      const SITE = (function() {
        const path = window.location.pathname;
        const pathMatch = path.match(/^\/([^/]+)/);
        if (pathMatch) return pathMatch[1];
        const host = window.location.hostname;
        const hostParts = host.split('.');
        if (hostParts.length >= 2 && !['www', 'pages', 'workers'].includes(hostParts[0])) {
          return hostParts[0];
        }
        return 'brazil-lander';
      })();

      function getOrCreateUserId() {
        try {
          let id = localStorage.getItem(STORAGE_KEY);
          if (!id) {
            id = 'bl_' + crypto.randomUUID();
            localStorage.setItem(STORAGE_KEY, id);
          }
          return id;
        } catch (e) {
          return 'bl_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        }
      }

      function track(action, duration) {
        const user = getOrCreateUserId();
        const payload = { user, action, site: SITE };
        if (typeof duration === 'number') payload.duration = duration;
        fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true,
        }).catch(() => {});
      }

      // Heartbeat: track time on site (only counts when tab is visible)
      let activeSeconds = 0;
      let lastVisibleAt = Date.now();
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          activeSeconds += Math.floor((Date.now() - lastVisibleAt) / 1000);
        } else {
          lastVisibleAt = Date.now();
        }
      });
      setInterval(function() {
        if (document.hidden) return;
        activeSeconds += Math.floor((Date.now() - lastVisibleAt) / 1000);
        lastVisibleAt = Date.now();
        track('heartbeat', activeSeconds);
      }, 20000);

      // Track page load
      track('page_load');

      // Track CTA click
      document.querySelector('.cta').addEventListener('click', function(e) {
        track('cta_click');
      });

      // Track clicks on embed zone
      document.getElementById('embed-target').addEventListener('click', function(e) {
        if (e.target.closest('a, button')) {
          track('embed_click_' + (e.target.textContent?.slice(0, 30) || 'link'));
        }
      });

      // Track SoundCloud play (debounced - SoundCloud fires PLAY multiple times)
      let lastPlayTracked = 0;
      const PLAY_DEBOUNCE_MS = 2000;
      function initSoundCloudTracking() {
        if (typeof SC === 'undefined') {
          setTimeout(initSoundCloudTracking, 100);
          return;
        }
        const iframe = document.getElementById('soundcloud-player');
        if (!iframe) return;
        const widget = SC.Widget(iframe);
        widget.bind(SC.Widget.Events.READY, function() {
          widget.bind(SC.Widget.Events.PLAY, function() {
            const now = Date.now();
            if (now - lastPlayTracked < PLAY_DEBOUNCE_MS) return;
            lastPlayTracked = now;
            track('soundcloud_play');
          });
        });
      }
      initSoundCloudTracking();
    })();
  </script>
</body>
</html>
